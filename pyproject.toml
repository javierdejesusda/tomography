[project]
name = "tomography"
version = "0.1.0"
description = "Representation Engineering (arXiv:2310.01405) reimplemented on GPT-2 and Qwen3: reading, control, and prompt and stimulus studies"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "javierdejesusda" }
]
requires-python = ">=3.12,<3.13"
dependencies = [
    "datasets>=5.1,<6",
    "matplotlib>=3.11,<4",
    "numpy>=2.5,<3",
    "peft>=0.21.2,<0.22",
    "plotly>=7.1,<8",
    "scikit-learn>=1.9,<2",
    "transformers>=5.19,<6",
]

[project.urls]
Repository = "https://github.com/javierdejesusda/tomography"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
cpu = ["torch"]
cu130 = ["torch"]
dev = [
    "codespell>=2.4,<3",
    "mypy>=2.4.0,<3",
    "pytest>=9.1.1,<10",
    "ruff>=0.17.0,<0.18",
]

[tool.uv]
default-groups = ["dev", "cu130"]
constraint-dependencies = ["torch>=2.14.1,<2.15"]
conflicts = [
    [
        { group = "cpu" },
        { group = "cu130" },
    ],
]

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", group = "cpu" },
    { index = "pytorch-cu130", group = "cu130" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.ruff]
line-length = 80

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "D", "UP", "B", "SIM", "PT", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D1"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
force-single-line = true
force-sort-within-sections = true

[tool.mypy]
strict = true

[[tool.mypy.overrides]]
module = ["datasets.*", "plotly.*", "sklearn.*"]
ignore_missing_imports = true

[tool.pytest]
testpaths = ["tests"]
addopts = ["--import-mode=importlib", "-m", "not slow and not network"]
markers = [
    "slow: needs a local GPU (CUDA torch, real GPT-2 or Qwen3 weights)",
    "network: downloads datasets or model weights from the Hub",
]
filterwarnings = ["error"]
strict_config = true
strict_markers = true
strict_parametrization_ids = true
strict_xfail = true
