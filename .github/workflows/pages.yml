name: Pages

on:
  push:
    branches: [main]
    paths:
      - "results/**"
      - "src/tomography/site/**"
      - "src/tomography/viz/**"
      - "docs/references.bib"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/pages.yml"
  pull_request:
    paths:
      - "results/**"
      - "src/tomography/site/**"
      - "src/tomography/viz/**"
      - "docs/references.bib"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pages-pr-{0}', github.ref) || 'pages' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      UV_NO_SYNC: "1"
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.3.0
        with:
          version: "0.12.17"
          cache-dependency-glob: uv.lock

      - name: Install the package
        run: uv sync --locked --no-dev --no-group cu130 --group cpu

      - name: Build the site
        run: uv run python -m tomography.site build --out _site

      - name: Print the page to PDF
        run: uv run python -m tomography.site pdf --site _site

      - name: Upload the site
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
