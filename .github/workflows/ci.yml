name: CI

on:
  pull_request:

permissions:
  contents: read

env:
  UV_NO_SYNC: "1"

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@v10.3.0
        with:
          version: "0.12.17"
          cache-dependency-glob: uv.lock

      - run: uv sync --locked --no-group cu130 --group cpu

      - name: Restore the bytecode cache
        id: bytecode
        uses: actions/cache/restore@v6
        with:
          path: ${{ runner.temp }}/pycache
          key: pyprobe-${{ runner.os }}-${{ hashFiles('uv.lock') }}

      - name: Probe
        env:
          OMP_NUM_THREADS: "1"
          HIT: ${{ steps.bytecode.outputs.cache-hit }}
        run: |
          P="$RUNNER_TEMP/pycache"
          F="$RUNNER_TEMP/fresh"
          TIMEFORMAT='%R s'
          collect() { PYTHONPYCACHEPREFIX="$1" uv run pytest --collect-only -q -p no:cacheprovider > /dev/null; }
          where() { sed -E 's|.*/site-packages/([^/]+)/.*|site-packages/\1|; s|.*/src/tomography/.*|src/tomography|; s|.*/tests/.*|tests|'; }
          echo "cache-hit=$HIT"
          echo "pyc in the restored prefix: $(find "$P" -name '*.pyc' 2>/dev/null | wc -l)"
          touch "$RUNNER_TEMP/marker"
          sleep 1
          echo "collect with the restored prefix:"; time collect "$P"
          echo "pyc after: $(find "$P" -name '*.pyc' | wc -l)"
          echo "pyc written by that collect: $(find "$P" -name '*.pyc' -newer "$RUNNER_TEMP/marker" | wc -l)"
          find "$P" -name '*.pyc' -newer "$RUNNER_TEMP/marker" | where | sort | uniq -c | sort -rn | head -15
          echo "collect with an empty prefix:"; time collect "$F"
          echo "collect again with that prefix:"; time collect "$F"
          echo "import alone, restored prefix:"; time PYTHONPYCACHEPREFIX="$P" uv run python -c "import torch, tomography" || true
          echo "import alone, empty prefix:"; time PYTHONPYCACHEPREFIX="$RUNNER_TEMP/fresh2" uv run python -c "import torch, tomography" || true

      - name: Save the bytecode cache
        if: steps.bytecode.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ runner.temp }}/pycache
          key: ${{ steps.bytecode.outputs.cache-primary-key }}
