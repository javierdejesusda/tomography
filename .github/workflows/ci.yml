name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  UV_NO_SYNC: "1"

jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.3.0
        with:
          version: "0.12.17"
          cache-dependency-glob: uv.lock

      - name: Install dependencies
        run: uv sync --locked --no-group cu130 --group cpu

      - name: Lint
        run: uv run ruff check .

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Spell check
        run: uv run codespell src tests README.md pyproject.toml

  typecheck:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.3.0
        with:
          version: "0.12.17"
          cache-dependency-glob: uv.lock

      - name: Install dependencies
        run: uv sync --locked --no-group cu130 --group cpu

      - name: Type check
        run: uv run mypy src

  test:
    name: test (${{ matrix.mode }} ${{ matrix.shard }})
    strategy:
      fail-fast: false
      matrix:
        mode: [serial, xdist]
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.3.0
        with:
          version: "0.12.17"
          cache-dependency-glob: uv.lock

      - name: Install dependencies
        run: uv sync --locked --no-group cu130 --group cpu

      - name: Test serial
        if: matrix.mode == 'serial'
        run: uv run pytest -q -p no:xdist --shard ${{ matrix.shard }}/8 --junitxml=junit.xml

      - name: Test xdist
        if: matrix.mode == 'xdist'
        env:
          OMP_NUM_THREADS: "1"
        run: uv run pytest -q -n 4 --dist loadfile --shard ${{ matrix.shard }}/8 --junitxml=junit.xml

      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: junit-${{ matrix.mode }}-${{ matrix.shard }}
          path: junit.xml

  checks:
    if: ${{ always() }}
    needs: [lint, typecheck, test]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every check to pass
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "$RESULTS"
          for result in $RESULTS; do
            [ "$result" = success ] || exit 1
          done
