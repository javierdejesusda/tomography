name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  measure:
    strategy:
      fail-fast: false
      matrix:
        mode: [serial, xdist, xdist-omp1]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      UV_NO_SYNC: "1"
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.3.0
        with:
          version: "0.12.17"
          cache-dependency-glob: uv.lock

      - name: Install dependencies
        run: uv sync --locked --no-group cu130 --group cpu

      - name: Describe the runner
        run: |
          nproc
          free -g
          uv run python -c "import torch; print(torch.get_num_threads())"

      - name: Collect
        run: |
          time uv run pytest --collect-only -q -p no:xdist > collected-plain.txt
          time uv run pytest --collect-only -q > collected-xdist.txt
          tail -n 2 collected-plain.txt collected-xdist.txt
          cmp collected-plain.txt collected-xdist.txt

      - name: Test serial
        if: matrix.mode == 'serial'
        run: uv run pytest -q -p no:xdist --durations=120 --junitxml=junit.xml

      - name: Test xdist
        if: matrix.mode == 'xdist'
        run: uv run pytest -q -n auto --durations=120 --junitxml=junit.xml

      - name: Test xdist with one torch thread
        if: matrix.mode == 'xdist-omp1'
        env:
          OMP_NUM_THREADS: "1"
        run: uv run pytest -q -n auto --durations=120 --junitxml=junit.xml

      - name: Upload the reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: measure-${{ matrix.mode }}
          path: |
            junit.xml
            collected-plain.txt
